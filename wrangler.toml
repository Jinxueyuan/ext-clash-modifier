name = "ext-clash-modifier"
main = "src/index.js"
compatibility_date = "2022-08-16"

# 可选：绑定 KV 后线路识别结果全局共享，不再按 Cloudflare 机房隔离。
# 先执行下面两条命令，把输出的 id 分别填进 id / preview_id，去掉注释再 deploy：
#   wrangler kv:namespace create IP_TYPE_KV
#   wrangler kv:namespace create IP_TYPE_KV --preview
# 不绑也能用，只是每个新机房要重新刷几次才能补齐。
# kv_namespaces = [
#   { binding = "IP_TYPE_KV", id = "<namespace_id>", preview_id = "<preview_id>" }
# ]

# 全新 clone 后没有 node_modules，Wrangler 打包会报
# Could not resolve "js-base64" / "js-yaml" / "js-ini"。
# 在 wrangler dev / deploy 打包前自动安装依赖。
[build]
command = "npm install --no-audit --no-fund"
